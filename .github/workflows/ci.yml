name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38
      - run: bun install
      - run: bun run check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38
      - run: bun install
      - run: docker compose -f compose.yaml -f compose.hardening.yaml up -d --build --wait postgres localstack
      - run: docker compose -f compose.yaml -f compose.hardening.yaml run --rm app bun run migration:fresh
      - run: docker compose -f compose.yaml -f compose.hardening.yaml up -d --scale app=3 app
      - run: docker compose -f compose.yaml -f compose.hardening.yaml run --rm --no-deps test bun run hardening
      - if: always()
        run: docker compose -f compose.yaml -f compose.hardening.yaml down -v
